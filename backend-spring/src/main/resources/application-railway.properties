# Railway Production Configuration
spring.application.name=levelup-gamer-api
spring.profiles.active=prod

# Server Configuration
server.port=${PORT:8080}

# Database Configuration handled by RailwayDataSourceConfig.java
# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
spring.security.jwt.secret-key=${JWT_SECRET_KEY:levelUpGamerSecretKey2024ForJWTTokenGeneration}
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}
spring.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://richardmoreano.github.io
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Logging Configuration
logging.level.root=INFO
logging.level.cl.duoc.levelup=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html