<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Debug Login - Level Up Gamer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 20px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        button:hover { background: #0056b3; }
        .message { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #e7f3ff; color: #0c5460; border: 1px solid #b8daff; }
        .debug { background: #f8f9fa; border: 1px solid #dee2e6; padding: 10px; margin: 10px 0; font-family: monospace; white-space: pre-wrap; }
        .user-info { background: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; border-radius: 4px; margin: 15px 0; }
        .btn-logout { background: #dc3545; }
        .btn-logout:hover { background: #c82333; }
        .btn-clean { background: #ffc107; color: #000; }
        .btn-debug { background: #28a745; }
    </style>
</head>
<body>
    <h1>🔧 Debug Completo del Sistema</h1>
    
    <div class="info">
        <h3>🧰 Acciones de Debug:</h3>
        <button onclick="limpiarTodo()" class="btn-clean">🧹 Limpiar Todo el localStorage</button>
        <button onclick="verLocalStorage()" class="btn-debug">👁️ Ver localStorage</button>
        <button onclick="crearUsuarios()" class="btn-debug">👥 Crear Usuarios de Prueba</button>
        <button onclick="testPanelCuenta()" class="btn-debug">📱 Test Panel Cuenta</button>
        <button onclick="logoutBrutal()" class="btn-logout">🚪 Logout Brutal</button>
    </div>

    <div id="debugInfo" class="debug"></div>
    
    <div id="sessionStatus"></div>
    
    <div id="loginForm">
        <h3>Iniciar Sesión</h3>
        <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" value="richard@duoc.cl">
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" value="admin">
        </div>
        <button onclick="testLogin()">Iniciar Sesión</button>
        
        <div class="info">
            <h4>Credenciales de prueba:</h4>
            <ul>
                <li><strong>Admin:</strong> admin@levelup.cl / admin123</li>
                <li><strong>Richard:</strong> richard@duoc.cl / admin</li>
                <li><strong>Vendedor:</strong> vendedor@levelup.cl / vendedor123</li>
            </ul>
        </div>
    </div>

    <div id="messages"></div>

    <script type="module" src="/site/app.js"></script>
    <script>
        // Funciones de debug
        function limpiarTodo() {
            localStorage.clear();
            document.getElementById('messages').innerHTML = '<div class="success">🧹 localStorage limpiado completamente</div>';
            setTimeout(() => location.reload(), 1000);
        }

        function verLocalStorage() {
            const debug = document.getElementById('debugInfo');
            let info = '📦 localStorage actual:\n';
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                info += `${key}: ${value.substring(0, 100)}${value.length > 100 ? '...' : ''}\n`;
            }
            debug.textContent = info;
        }

        function crearUsuarios() {
            if (window.crearUsuariosPrueba) {
                crearUsuariosPrueba();
                document.getElementById('messages').innerHTML = '<div class="success">👥 Usuarios creados manualmente</div>';
                verLocalStorage(); // Actualizar vista
            } else {
                document.getElementById('messages').innerHTML = '<div class="error">❌ Función no disponible</div>';
            }
        }

        function testPanelCuenta() {
            console.log('🧪 Testing panel cuenta...');
            const user = usuarioActual();
            console.log('Usuario actual:', user);
            
            if (user && window.abrirPanelCuenta) {
                abrirPanelCuenta();
                document.getElementById('messages').innerHTML = '<div class="success">📱 Panel cuenta abierto</div>';
            } else {
                document.getElementById('messages').innerHTML = '<div class="error">❌ No se puede abrir panel</div>';
            }
        }

        function logoutBrutal() {
            console.log('🚪 Ejecutando logout brutal...');
            // Limpiar solo la sesión, mantener usuarios
            localStorage.removeItem('sesion');
            localStorage.removeItem('sesionActual');
            localStorage.removeItem('token');
            
            document.getElementById('messages').innerHTML = '<div class="success">🚪 Sesión cerrada brutalmente</div>';
            setTimeout(() => {
                location.reload();
            }, 1000);
        }

        // Verificar estado de sesión al cargar
        function checkSession() {
            console.log('🔍 Verificando sesión...');
            const user = usuarioActual();
            const statusDiv = document.getElementById('sessionStatus');
            const loginForm = document.getElementById('loginForm');
            
            console.log('Usuario obtenido:', user);
            
            if (user) {
                statusDiv.innerHTML = `
                    <div class="user-info">
                        <h3>👤 Usuario Logueado</h3>
                        <p><strong>Nombre:</strong> ${user.nombres} ${user.apellidos}</p>
                        <p><strong>Correo:</strong> ${user.correo}</p>
                        <p><strong>Tipo:</strong> ${user.tipoUsuario}</p>
                        <p><strong>Puntos:</strong> ${user.puntosLevelUp || 0}</p>
                        <button onclick="testLogout()" class="btn-logout">Cerrar Sesión</button>
                    </div>
                `;
                loginForm.style.display = 'none';
            } else {
                statusDiv.innerHTML = '<div class="info">❌ No hay usuario logueado</div>';
                loginForm.style.display = 'block';
            }
            
            // Mostrar localStorage automáticamente
            verLocalStorage();
        }

        async function testLogin() {
            console.log('🔑 Iniciando login...');
            const correo = document.getElementById('correo').value;
            const password = document.getElementById('password').value;
            const messages = document.getElementById('messages');
            
            try {
                const result = await loginUsuario(correo, password);
                console.log('✅ Login exitoso:', result);
                messages.innerHTML = `<div class="success">✅ ${result.message}</div>`;
                setTimeout(checkSession, 500);
            } catch (error) {
                console.error('❌ Error login:', error);
                messages.innerHTML = `<div class="error">❌ ${error.message}</div>`;
            }
        }

        function testLogout() {
            console.log('🚪 Iniciando logout...');
            cerrarSesion();
        }

        // Verificar al cargar la página
        window.addEventListener('DOMContentLoaded', () => {
            console.log('📄 Página cargada, verificando estado...');
            setTimeout(checkSession, 100);
        });
    </script>
</body>
</html>
