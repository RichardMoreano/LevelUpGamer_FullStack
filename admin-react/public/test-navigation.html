<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST - Navegación Level Up</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        a { color: #4CAF50; margin: 10px; display: inline-block; text-decoration: none; padding: 10px; background: #333; border-radius: 5px; }
        a:hover { background: #555; }
        .status { padding: 10px; background: #333; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>🧪 TEST DE NAVEGACIÓN - Level Up</h1>
    
    <div class="status" id="usuario-status">
        <h3>Estado de Usuario:</h3>
        <p id="usuario-info">Cargando...</p>
    </div>
    
    <h3>🔗 Links de Navegación:</h3>
    <div>
        <a href="/cliente/index.html">🏠 Inicio Cliente</a>
        <a href="/cliente/nosotros.html">👥 Nosotros</a>
        <a href="/cliente/contacto.html">📞 Contacto</a>
        <a href="/cliente/productos.html">🛍️ Productos</a>
        <a href="/cliente/login.html">🔐 Login</a>
    </div>
    
    <h3>📋 Logs de Consola:</h3>
    <div id="logs" style="background: #000; padding: 10px; font-family: monospace; font-size: 12px;">
        
    </div>
    
    <script src="site/app.js"></script>
    <script>
        // Override console.log para mostrar en página
        const originalLog = console.log;
        const logsDiv = document.getElementById('logs');
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logsDiv.innerHTML += args.join(' ') + '<br>';
            logsDiv.scrollTop = logsDiv.scrollHeight;
        };
        
        // Mostrar info de usuario
        document.addEventListener('DOMContentLoaded', () => {
            const user = usuarioActual();
            const userInfo = document.getElementById('usuario-info');
            
            if (user) {
                userInfo.innerHTML = `
                    <strong>✅ Usuario logueado:</strong><br>
                    📧 Email: ${user.correo}<br>
                    👤 Tipo: ${user.tipoUsuario}<br>
                    🏷️ Nombre: ${user.nombres} ${user.apellidos}
                `;
                userInfo.style.background = '#2d5a2d';
            } else {
                userInfo.innerHTML = '<strong>❌ Sin usuario logueado</strong>';
                userInfo.style.background = '#5a2d2d';
            }
            
            console.log('🧪 TEST: Estado de usuario:', user);
        });
    </script>
</body>
</html>
