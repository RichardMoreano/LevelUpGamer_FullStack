<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧹 Limpiar LocalStorage</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%); 
            color: white; 
            text-align: center;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #333; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        button { 
            background: #e74c3c; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 8px; 
            font-size: 18px; 
            cursor: pointer; 
            margin: 10px;
            transition: all 0.3s ease;
        }
        button:hover { 
            background: #c0392b; 
            transform: translateY(-2px);
        }
        .success { 
            background: #27ae60; 
            padding: 15px; 
            border-radius: 8px; 
            margin: 20px 0; 
            display: none;
        }
        .storage-info {
            background: #34495e;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        .nav-links {
            margin-top: 30px;
        }
        .nav-links a {
            background: #3498db;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            margin: 0 10px;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .nav-links a:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 Limpieza de LocalStorage</h1>
        <p>Esta página limpiará completamente localStorage para eliminar sesiones fantasma.</p>
        
        <div class="storage-info" id="storage-info">
            <h3>📋 Contenido actual de LocalStorage:</h3>
            <div id="storage-content"></div>
        </div>
        
        <button onclick="limpiarTodo()">🗑️ LIMPIAR TODO LOCALSTORAGE</button>
        <button onclick="mostrarStorage()">🔍 Mostrar LocalStorage</button>
        
        <div class="success" id="success-msg">
            ✅ ¡LocalStorage limpiado exitosamente!<br>
            🔄 Recarga la página para verificar que no hay sesiones fantasma.
        </div>
        
        <div class="nav-links">
            <a href="/cliente/index.html">🏠 Ir a Inicio</a>
            <a href="/cliente/login.html">🔐 Ir a Login</a>
            <a href="/test-navigation.html">🧪 Test Navigation</a>
        </div>
    </div>
    
    <script>
        function mostrarStorage() {
            const storageDiv = document.getElementById('storage-content');
            const items = {};
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                items[key] = value;
            }
            
            if (Object.keys(items).length === 0) {
                storageDiv.innerHTML = '<p style="color: #27ae60;">✅ LocalStorage está vacío</p>';
            } else {
                let html = '<ul style="text-align: left; font-size: 12px; font-family: monospace;">';
                for (const [key, value] of Object.entries(items)) {
                    html += `<li><strong>${key}:</strong> ${value.substring(0, 100)}${value.length > 100 ? '...' : ''}</li>`;
                }
                html += '</ul>';
                storageDiv.innerHTML = html;
            }
        }
        
        function limpiarTodo() {
            console.log('🧹 Limpiando localStorage...');
            
            // Limpiar COMPLETAMENTE localStorage
            localStorage.clear();
            
            // También limpiar sessionStorage por si acaso
            sessionStorage.clear();
            
            // Mostrar mensaje de éxito
            document.getElementById('success-msg').style.display = 'block';
            
            // Actualizar vista
            mostrarStorage();
            
            console.log('✅ LocalStorage y SessionStorage limpiados completamente');
        }
        
        // Mostrar contenido al cargar
        document.addEventListener('DOMContentLoaded', () => {
            mostrarStorage();
        });
    </script>
</body>
</html>
